name: Generate weekly plan

on:
  schedule:
    # Sunday 6pm local (cron is evaluated in the timezone below)
    - cron: "0 18 * * 0"
      timezone: "Australia/Sydney"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fresh sync before planning
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Australia/Sydney' }}
        run: |
          python scripts/sync_garmin.py
          python scripts/compute_metrics.py

      - name: Generate plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ATHLETE_PROFILE_PRIVATE: ${{ secrets.ATHLETE_PROFILE_PRIVATE }}
          LOCATION_LAT: ${{ secrets.LOCATION_LAT }}
          LOCATION_LON: ${{ secrets.LOCATION_LON }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Australia/Sydney' }}
          TRAINER_MODEL: ${{ vars.TRAINER_MODEL }}
          TRAINER_EFFORT: ${{ vars.TRAINER_EFFORT }}
          PLAN_OVERRIDE: ${{ vars.PLAN_OVERRIDE || secrets.PLAN_OVERRIDE }}
        run: python scripts/generate_plan.py

      - name: Commit plan
        run: |
          git config user.name "fitness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && exit 0
          git commit -m "weekly plan $(date -u +%F)"
          # Rebase onto anything pushed while this job ran (e.g. a code change)
          git pull --rebase
          git push
