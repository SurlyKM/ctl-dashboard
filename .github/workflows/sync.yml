name: Sync Garmin data

on:
  schedule:
    # 4x daily UTC. In Sydney terms roughly 11am, 5pm, 11pm, 5am AEST.
    - cron: "15 1,7,13,19 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync from Garmin
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
        run: python scripts/sync_garmin.py

      - name: Compute metrics
        run: python scripts/compute_metrics.py

      - name: Commit data
        run: |
          git config user.name "fitness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "data sync $(date -u +%FT%TZ)"
          git push
