name: Sync Garmin data

on:
  schedule:
    - cron: "30 5,7,9,13,17,20 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Refetch the full 200-day window (fills gaps, replaces stale days)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync from Garmin
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Australia/Sydney' }}
          # Empty on scheduled runs, "true"/"false" on manual runs. Passed via
          # env rather than inlined into the script, so it can't inject shell.
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python scripts/sync_garmin.py --backfill
          else
            python scripts/sync_garmin.py
          fi

      - name: Compute metrics
        run: python scripts/compute_metrics.py

      - name: Commit data
        run: |
          git config user.name "fitness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && exit 0
          git commit -m "data sync $(date -u +%FT%TZ)"
          # Rebase onto anything pushed while this job ran (e.g. a code change)
          git pull --rebase
          git push
